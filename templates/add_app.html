{% extends "base.html" %}
{% block title %}Add App — Saurav App Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Add New App</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">App Name *</label>
                        <input type="text" name="name" class="form-control" required maxlength="100"
                               placeholder="e.g. My Awesome App">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="What does this app do?"></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Version</label>
                            <input type="text" name="version" class="form-control" value="1.0"
                                   placeholder="1.0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Visibility</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="is_admin_only" id="adminOnly">
                                <label class="form-check-label" for="adminOnly">
                                    Admin Only (hidden from public)
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">App File * (APK / ZIP / EXE / etc.)</label>
                        <input type="file" name="app_file" class="form-control" required
                               accept=".apk,.zip,.exe,.dmg,.msi,.deb,.AppImage,.ipa">
                        <div class="form-text">Allowed: apk, zip, exe, dmg, msi, deb, AppImage, ipa</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">App Icon (optional)</label>
                        <input type="file" name="icon" class="form-control"
                               accept=".png,.jpg,.jpeg,.webp,.gif">
                        <div class="form-text">Recommended: 128×128 or larger PNG</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-cloud-upload"></i> Upload App
                        </button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
